<div class="cv cv-bk">
  <header class="cv-bk-head">
    <h1 data-field="personal.fullName">Full Name</h1>
    <p class="cv-bk-title" data-field="personal.title"></p>
    <ul class="cv-bk-contact">
      <li data-field="personal.phone"></li>
      <li data-field="personal.email"></li>
      <li data-field="personal.location"></li>
      <li data-field="personal.linkedin" data-if="personal.linkedin"></li>
    </ul>
  </header>

  <div class="cv-bk-body">
    <div class="cv-bk-col cv-bk-col-left">
      <section data-if="education">
        <h2>Education</h2>
        <div data-list="education">
          <template>
            <div class="cv-bk-item">
              <strong data-field="degree"></strong>
              <div data-field="course"></div>
              <div class="cv-bk-sub" data-field="institution"></div>
              <div class="cv-bk-year" data-field="year"></div>
            </div>
          </template>
        </div>
      </section>

      <section data-if="skills">
        <h2>Core Skills</h2>
        <ul class="cv-bk-plain" data-list="skills">
          <template><li data-field="."></li></template>
        </ul>
      </section>

      <section data-if="certifications">
        <h2>Certifications</h2>
        <ul class="cv-bk-plain" data-list="certifications">
          <template><li data-field="."></li></template>
        </ul>
      </section>

      <section data-if="languages">
        <h2>Languages</h2>
        <ul class="cv-bk-plain" data-list="languages">
          <template><li data-field="."></li></template>
        </ul>
      </section>
    </div>

    <div class="cv-bk-col cv-bk-col-right">
      <section data-if="personal.summary">
        <h2>Professional Summary</h2>
        <p data-field-html="personal.summary"></p>
      </section>

      <section data-if="experience">
        <h2>Work Experience</h2>
        <div data-list="experience">
          <template>
            <div class="cv-bk-exp">
              <div class="cv-bk-exp-head">
                <strong data-field="position"></strong>
                <span data-field="dates"></span>
              </div>
              <div class="cv-bk-sub" data-field="company"></div>
              <ul data-list="responsibilities">
                <template><li data-field="."></li></template>
              </ul>
            </div>
          </template>
        </div>
      </section>

      <section data-if="references">
        <h2>References</h2>
        <div class="cv-bk-refs" data-list="references">
          <template>
            <div class="cv-bk-ref">
              <strong data-field="name"></strong> — <span data-field="relation"></span><br>
              <span data-field="phone"></span> &middot; <span data-field="email"></span>
            </div>
          </template>
        </div>
      </section>
    </div>
  </div>
</div>
