<div class="cl2">
  <header class="cl2-head">
    <strong data-field="personal.fullName"></strong>
    <div class="cl2-contact">
      <span data-field="personal.location"></span>
      <span data-field="personal.phone"></span>
      <span data-field="personal.email"></span>
    </div>
  </header>

  <div class="cl2-body-wrap">
    <div class="cl2-date" data-field="date"></div>

    <div class="cl2-recipient" data-if="recipient.hiringManager">
      <div data-field="recipient.hiringManager"></div>
      <div data-field="recipient.company"></div>
      <div data-field="recipient.companyAddress"></div>
    </div>

    <p class="cl2-salutation" data-field="salutation">Dear Hiring Manager,</p>

    <div class="cl2-body" data-list="body">
      <template><p data-field="."></p></template>
    </div>

    <p class="cl2-closing" data-field="closing">Yours faithfully,</p>
    <p class="cl2-signature" data-field="personal.fullName"></p>
  </div>
</div>
