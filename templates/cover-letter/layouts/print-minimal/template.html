<div class="cl5">
  <div class="cl5-sender">
    <strong data-field="personal.fullName"></strong>
    <div class="cl5-contact">
      <span data-field="personal.phone"></span> &middot;
      <span data-field="personal.email"></span> &middot;
      <span data-field="personal.location"></span>
    </div>
  </div>
  <div class="cl5-rule"></div>

  <div class="cl5-date" data-field="date"></div>

  <div class="cl5-recipient" data-if="recipient.hiringManager">
    <div data-field="recipient.hiringManager"></div>
    <div data-field="recipient.company"></div>
    <div data-field="recipient.companyAddress"></div>
  </div>

  <p class="cl5-salutation" data-field="salutation">Dear Hiring Manager,</p>

  <div class="cl5-body" data-list="body">
    <template><p data-field="."></p></template>
  </div>

  <p class="cl5-closing" data-field="closing">Yours faithfully,</p>
  <p class="cl5-signature" data-field="personal.fullName"></p>
  </div>
